<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="A mobile-first Sudoku game" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Sudoku" />
    <link rel="manifest" href="manifest.webmanifest" />

    <title>Sudoku Game</title>

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-weight='bold' fill='%231a1a2e'>S</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Main App Container -->
    <div id="app" class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="header-content">
          <h1 class="app-title">Sudoku</h1>
          <div class="header-info">
            <div class="info-item">
              <span class="info-label">Time</span>
              <span id="timer" class="info-value">00:00</span>
            </div>
            <div class="info-item">
              <span class="info-label">Mistakes</span>
              <span id="mistakes" class="info-value">0/3</span>
            </div>
            <div class="info-item">
              <span class="info-label">Hints</span>
              <span id="hints-used" class="info-value">0</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Game Area -->
      <main class="game-main">
        <!-- Difficulty Selection Screen -->
        <div id="difficulty-screen" class="screen active">
          <div class="screen-content">
            <h2>New Game</h2>
            <p class="subtitle">Select Difficulty</p>

            <div class="difficulty-buttons">
              <button
                id="btn-easy"
                class="btn btn-difficulty btn-easy"
                data-difficulty="easy"
              >
                <span class="btn-title">Easy</span>
                <span class="btn-subtitle">40 clues</span>
              </button>
              <button
                id="btn-medium"
                class="btn btn-difficulty btn-medium"
                data-difficulty="medium"
              >
                <span class="btn-title">Medium</span>
                <span class="btn-subtitle">32 clues</span>
              </button>
              <button
                id="btn-hard"
                class="btn btn-difficulty btn-hard"
                data-difficulty="hard"
              >
                <span class="btn-title">Hard</span>
                <span class="btn-subtitle">26 clues</span>
              </button>
            </div>

            <div class="action-buttons">
              <button id="btn-resume-game" class="btn btn-secondary" hidden>
                Resume Game
              </button>
            </div>
          </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
          <div class="screen-content">
            <!-- Sudoku Board -->
            <div
              id="sudoku-board"
              class="sudoku-board"
              role="grid"
              aria-label="Sudoku puzzle grid"
              aria-describedby="message-box"
            >
              <!-- Cells will be generated by JavaScript -->
            </div>

            <!-- Game Controls -->
            <div class="game-controls" aria-label="Puzzle tools">
              <button id="btn-hint" class="btn btn-control" title="Get a hint">
                💡 Hint
              </button>
              <button
                id="btn-check"
                class="btn btn-control"
                title="Check your progress"
              >
                ✓ Check
              </button>
              <button
                id="btn-reset"
                class="btn btn-control"
                title="Clear board"
              >
                ↺ Reset
              </button>
            </div>

            <!-- Number Pad -->
            <div class="number-pad" aria-label="Number pad">
              <div class="number-row">
                <button class="btn btn-number" data-number="1">1</button>
                <button class="btn btn-number" data-number="2">2</button>
                <button class="btn btn-number" data-number="3">3</button>
              </div>
              <div class="number-row">
                <button class="btn btn-number" data-number="4">4</button>
                <button class="btn btn-number" data-number="5">5</button>
                <button class="btn btn-number" data-number="6">6</button>
              </div>
              <div class="number-row">
                <button class="btn btn-number" data-number="7">7</button>
                <button class="btn btn-number" data-number="8">8</button>
                <button class="btn btn-number" data-number="9">9</button>
              </div>
              <div class="number-row">
                <button id="btn-erase" class="btn btn-erase" title="Erase">
                  Erase
                </button>
              </div>
            </div>

            <!-- Game Action Buttons -->
            <div class="game-action-buttons" aria-label="Game actions">
              <button id="btn-pause" class="btn btn-secondary">⏸ Pause</button>
              <button id="btn-new-game" class="btn btn-secondary">
                ⊕ New Game
              </button>
              <button id="btn-home" class="btn btn-secondary">⌂ Home</button>
            </div>
          </div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="screen">
          <div class="screen-content screen-overlay">
            <h2>Game Paused</h2>
            <p id="pause-time" class="subtitle">Time: 00:00</p>

            <div class="action-buttons">
              <button id="btn-resume" class="btn btn-primary">▶ Resume</button>
              <button id="btn-new-from-pause" class="btn btn-secondary">
                ⊕ New Game
              </button>
              <button id="btn-home-from-pause" class="btn btn-secondary">
                ⌂ Home
              </button>
            </div>
          </div>
        </div>

        <!-- Win Screen -->
        <div id="win-screen" class="screen">
          <div class="screen-content screen-overlay">
            <h2>Puzzle Complete!</h2>
            <p id="win-time" class="subtitle">Time: 00:00</p>
            <p id="win-mistakes" class="subtitle">Mistakes: 0</p>

            <div class="action-buttons">
              <button id="btn-next-puzzle" class="btn btn-primary">
                ⊕ Next Puzzle
              </button>
              <button id="btn-share" class="btn btn-secondary" hidden>
                ⬆ Share Score
              </button>
              <button id="btn-home-from-win" class="btn btn-secondary">
                ⌂ Home
              </button>
            </div>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <div
        id="message-box"
        class="message-box"
        role="status"
        aria-live="polite"
        hidden
      ></div>

      <footer class="app-footer">
        <p>Play offline. Your progress stays on this device.</p>
      </footer>
    </div>

    <!-- App Scripts -->
    <script type="module" src="js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
